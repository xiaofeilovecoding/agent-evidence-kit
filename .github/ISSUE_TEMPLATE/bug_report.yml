name: Bug report / 问题反馈
description: Report a reproducible problem using synthetic or sanitized evidence.
labels: [bug]
body:
  - type: markdown
    attributes:
      value: |
        Use synthetic examples. Never paste real keys, private raw logs, secret commands or personal paths. Report vulnerabilities privately through the Security tab.
        请使用合成示例，不要贴真实密钥、私密日志、含秘密的命令或个人路径。安全漏洞通过 Security 私密报告。
  - type: input
    id: version
    attributes:
      label: Version or commit / 版本或提交
    validations:
      required: true
  - type: dropdown
    id: area
    attributes:
      label: Area / 所属模块
      options:
        - Config / 配置检查
        - Stream / 流结束检查
        - Web UI / 网页界面
        - CLI or installation / 命令行或安装
        - Documentation / 文档
    validations:
      required: true
  - type: textarea
    id: reproduce
    attributes:
      label: Reproduction / 复现步骤
      description: Include steps and a minimal synthetic input, or explain why input is unnecessary.
    validations:
      required: true
  - type: textarea
    id: behavior
    attributes:
      label: Expected and actual behavior / 预期与实际表现
    validations:
      required: true
  - type: textarea
    id: environment
    attributes:
      label: Environment / 运行环境
      description: OS, Python version, browser and language; optional sanitized evidence card or screenshot.
  - type: checkboxes
    id: privacy
    attributes:
      label: Before submitting / 提交前确认
      options:
        - label: I checked that this report contains no real secrets or private raw data. / 已确认没有真实秘密或私密原文。
          required: true
