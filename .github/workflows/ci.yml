name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  core:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11", "3.14"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Run core tests (standard library only)
        run: python -m unittest discover -s tests -v

  web:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install with web extra
        run: pip install -e ".[web]" httpx
      - name: Run HTTP layer tests
        run: python -m unittest tests.test_web tests.test_clear_race -v

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm ci --no-audit --no-fund
      - name: Typecheck
        run: npm run typecheck
      - name: Build local UI
        run: npm run build
      - name: Build sample showcase
        run: npm run build:showcase
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install browser test dependencies
        working-directory: .
        run: |
          python -m pip install -e ".[web]" httpx playwright
          python -m playwright install --with-deps chromium
          python scripts/build_frontend.py --sync-only
      - name: Run real browser and delayed-response regressions
        working-directory: .
        run: python -m unittest tests.test_browser tests.test_review_fixes tests.test_export_races -v
