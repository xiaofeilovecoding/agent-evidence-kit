[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "agent-evidence-kit"
version = "0.1.0"
description = "Local, privacy-safe evidence cards for agent troubleshooting: MCP config structure checks and LLM stream terminal-evidence checks (CLI + local web UI)"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "Agent Evidence Kit contributors" }]
keywords = ["mcp", "agent", "diagnostics", "llm", "sse", "privacy", "cli"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Environment :: Console",
  "Intended Audience :: Developers",
  "License :: OSI Approved :: MIT License",
  "Operating System :: OS Independent",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Programming Language :: Python :: 3.14",
  "Topic :: Software Development :: Debuggers",
]
# The diagnostic cores are standard library only. Web support is optional.
dependencies = []

[project.optional-dependencies]
web = ["fastapi>=0.110", "uvicorn>=0.29"]

[project.urls]
Repository = "https://github.com/xiaofeilovecoding/agent-evidence-kit"
Issues = "https://github.com/xiaofeilovecoding/agent-evidence-kit/issues"

[tool.hatch.build.targets.wheel]
packages = ["agent_evidence_kit"]

[tool.hatch.build.targets.sdist]
include = [
  "/agent_evidence_kit",
  "/tests",
  "/examples",
  "/scripts",
  "/frontend/src",
  "/frontend/public",
  "/frontend/package.json",
  "/frontend/package-lock.json",
  "/frontend/tsconfig.json",
  "/frontend/vite.config.ts",
  "/frontend/index.html",
  "/frontend/.env.showcase",
  "/README.md",
  "/README.zh-CN.md",
  "/LICENSE",
  "/CONTRIBUTING.md",
  "/SECURITY.md",
  "/docs/screenshots",
]
exclude = ["/frontend/node_modules", "/frontend/dist", "/frontend/dist-showcase"]
